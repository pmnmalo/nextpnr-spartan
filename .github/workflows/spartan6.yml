# nextpnr-spartan: nextpnr-himbaechel with spartan6: its test netlists, natively and in WebAssembly. A spartan6-v* tag's
# run publishes the WebAssembly package and the chip databases as a release.
name: spartan6

on:
  push:
    branches: [silinx]
    tags: ['spartan6-v*']
    paths: ['himbaechel/uarch/spartan6/**', '.github/workflows/spartan6.yml']
  workflow_dispatch:

env:
  # Silinx's commit whose device graphs, bit database and delay model the chip database is built from
  SILINX_REF: 73c0c13651ffa5db8eb223c5dbda16cd4cc429a1

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pmnmalo/Silinx-ISE
          ref: ${{ env.SILINX_REF }}
          path: silinx
          sparse-checkout: packages/silinx-fpga
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libboost-dev libboost-program-options-dev libboost-iostreams-dev \
            libboost-thread-dev libeigen3-dev python3
      - name: Build and test
        run: himbaechel/uarch/spartan6/ci/build-and-test.sh silinx build

  wasm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # a spartan6-v* tag's release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pmnmalo/Silinx-ISE
          ref: ${{ env.SILINX_REF }}
          path: silinx
          sparse-checkout: packages/silinx-fpga
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libboost-dev libboost-program-options-dev libboost-iostreams-dev \
            libboost-filesystem-dev libboost-thread-dev python3
      - uses: actions/cache@v4
        with:
          path: |
            wasm-build/wasi-sdk-34.0-x86_64-linux
            wasm-build/boost-1.81.0
            wasm-build/eigen-prefix
          key: wasm-deps-${{ hashFiles('himbaechel/uarch/spartan6/ci/build-wasm.sh') }}
      - name: Build for WebAssembly and package
        run: |
          case "$GITHUB_REF_NAME" in spartan6-v*) export RELEASE_VERSION="${GITHUB_REF_NAME#spartan6-}" ;; esac
          himbaechel/uarch/spartan6/ci/build-wasm.sh silinx wasm-build
      - name: Test the package in Node
        run: node himbaechel/uarch/spartan6/ci/test-wasm.mjs wasm-build/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: wasm-build/dist/*.tgz
      - name: Release (a spartan6-v* tag)
        if: startsWith(github.ref, 'refs/tags/spartan6-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" wasm-build/dist/*.tgz wasm-build/npm/chipdb/*.bin.gz \
            --title "nextpnr-himbaechel-spartan6 $GITHUB_REF_NAME (WebAssembly)" \
            --notes "nextpnr-himbaechel with the Xilinx Spartan-6 (spartan6), in WebAssembly, for Silinx ISE: the npm package (@silinx/nextpnr-himbaechel-spartan6) and each device's chip database (gzipped). See himbaechel/uarch/spartan6/README.md."
