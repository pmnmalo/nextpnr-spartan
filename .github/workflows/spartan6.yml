# nextpnr-spartan: nextpnr-himbaechel with spartan6: its test netlists, natively and in WebAssembly. A spartan6-v* tag's
# run publishes the WebAssembly package and the chip databases as a release, and stages the package on npm
# (@silinx/nextpnr-himbaechel-spartan6), as spartan3e.yml does (pmnmalo/Silinx#3141).
name: spartan6

on:
  push:
    branches: [silinx]
    tags: ['spartan6-v*']
    paths: ['himbaechel/uarch/spartan6/**', '.github/workflows/spartan6.yml']
  pull_request:
    paths: ['himbaechel/uarch/spartan6/**', '.github/workflows/spartan6.yml']
  workflow_dispatch:

env:
  # Silinx's commit whose device graphs, bit database and delay model the chip database is built from (with the PIPs it
  # holds out of its own flow until this chip database has them, its bitdb/s6/s6-pips-held.json: pmnmalo/Silinx#3349)
  SILINX_REF: 775295477b7ba3e559d144e4efd5b723b419d466

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pmnmalo/Silinx-ISE
          ref: ${{ env.SILINX_REF }}
          path: silinx
          sparse-checkout: packages/silinx-fpga
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libboost-dev libboost-program-options-dev libboost-iostreams-dev \
            libboost-thread-dev libeigen3-dev python3
      - name: Build and test
        run: himbaechel/uarch/spartan6/ci/build-and-test.sh silinx build

  wasm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # a spartan6-v* tag's release
      id-token: write   # its npm publish: npm's trusted publishing (no token), with provenance (Silinx #3141)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pmnmalo/Silinx-ISE
          ref: ${{ env.SILINX_REF }}
          path: silinx
          sparse-checkout: packages/silinx-fpga
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libboost-dev libboost-program-options-dev libboost-iostreams-dev \
            libboost-filesystem-dev libboost-thread-dev python3
      - uses: actions/cache@v4
        with:
          path: |
            wasm-build/wasi-sdk-34.0-x86_64-linux
            wasm-build/boost-1.81.0
            wasm-build/eigen-prefix
          key: wasm-deps-${{ hashFiles('himbaechel/uarch/spartan6/ci/build-wasm.sh') }}
      - name: Build for WebAssembly and package
        run: |
          # a spartan6-v* tag's version (spartan6-v0.3.1 -> v0.3.1), which must be npm/package.json's
          case "$GITHUB_REF" in refs/tags/spartan6-v*) export RELEASE_VERSION="${GITHUB_REF_NAME#spartan6-}" ;; esac
          himbaechel/uarch/spartan6/ci/build-wasm.sh silinx wasm-build
      - name: Test the package in Node
        run: node himbaechel/uarch/spartan6/ci/test-wasm.mjs wasm-build/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: wasm-build/dist/*.tgz
      - name: Release (a spartan6-v* tag)
        if: startsWith(github.ref, 'refs/tags/spartan6-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0   # (a re-run: its release is there)
          gh release create "$GITHUB_REF_NAME" wasm-build/dist/*.tgz wasm-build/npm/chipdb/*.bin.gz \
            --title "nextpnr-himbaechel-spartan6 $GITHUB_REF_NAME (WebAssembly)" \
            --notes "nextpnr-himbaechel with the Xilinx Spartan-6 (spartan6), in WebAssembly, for Silinx ISE: the npm package (@silinx/nextpnr-himbaechel-spartan6, run by @yowasp/runtime) and each device's chip database (gzipped). Built and tested by this tag's CI run: the test netlists in Node give the frequencies recorded. See himbaechel/uarch/spartan6/README.md."
      # the same package staged on npm, from this run (npm's trusted publishing: this repository and workflow, set on the
      # package's settings at npmjs.com), with its provenance: public once the maintainer approves it, with 2FA
      # (npm stage list, npm stage approve <id>)
      - name: Stage on npm (a spartan6-v* tag)
        if: startsWith(github.ref, 'refs/tags/spartan6-v')
        run: |
          npm install -g npm@12
          npm stage publish wasm-build/dist/*.tgz --provenance --access public
